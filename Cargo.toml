[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/bgyss/blender-elements-suite"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
half = { version = "2.7.1", features = ["bytemuck"] }
interprocess = "2.4.4"
memmap2 = "0.9.11"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
wgpu = "30.0.1"

approx = "0.5.1"
tempfile = "3.27.0"
vdb-rs = "0.6.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
